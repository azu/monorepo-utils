# This workflow often runs following steps when a PR is merged to main branch.
# 1. jobs.check checks if we need to release
# 2. jobs.release publish packages
#
# Note: Force publish
# You can publish packages manually by running workflow dispatch
# This workflow dispatch skip jobs.check process
# 1. dispatch "release" workflow
# 2. Open Release Page
# 3. Generate Release Note
name: Release

on:
  pull_request:
    branches:
      - main
      - master
    types: [ closed ]
  workflow_dispatch: # force release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # when release PR is merged or workflow_dispatch is triggered, run this job
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    outputs:
      EXISTS_TAG: ${{ steps.tag_check.outputs.EXISTS_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set PACKAGE_VERSION
        run: echo "PACKAGE_VERSION=$(jq -r .version lerna.json)" >> "$GITHUB_ENV"
      - name: Tag Check
        id: tag_check
        run: |
          GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}"
          http_status_code=$(curl -LI "$GET_API_URL" -o /dev/null -w '%{http_code}\n' -s \
            -H "Authorization: token ${GITHUB_TOKEN}")
          if [ "$http_status_code" -ne "404" ] ; then
            echo "EXISTS_TAG=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS_TAG=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG_NAME: v${{ env.PACKAGE_VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    if: always() && (needs.check.outputs.EXISTS_TAG == 'false')
    # require approval by Deployment protection rules before publishing
    # npm Trusted Publisher should be configured with the same environment name
    environment:
      name: npm
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # pnpm stage publish supports trusted publishing (OIDC) natively
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set PACKAGE_VERSION
        run: echo "PACKAGE_VERSION=$(jq -r .version lerna.json)" >> "$GITHUB_ENV"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r run build
      - name: Staged Publish to npm
        # submit packages to npm staging area, and approve them on npmjs.com after this step
        # it skips packages whose version is already published
        # (lerna fixed mode does not bump unchanged packages)
        run: pnpm -r stage publish --no-git-checks --access public
      - name: Create Git Tag
        uses: pkgdeps/git-tag-action@a5a161774bace8b4e1969dd850c67a7421f1b710 # v3.0.1
        with:
          version: ${{ env.PACKAGE_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"
      - name: Create Release
        # Copy Pull Request's body to Release Note
        # if the body is empty, generate release notes
        run: |
          if [ -n "$PR_BODY" ]; then
            gh release create "v${PACKAGE_VERSION}" --repo "$GITHUB_REPOSITORY" --notes "$PR_BODY"
          else
            gh release create "v${PACKAGE_VERSION}" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name != 'workflow_dispatch'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 Release https://github.com/${{ github.repository }}/releases/tag/v${{ env.PACKAGE_VERSION }}'
            })
