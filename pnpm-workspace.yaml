packages:
  - "packages/@monorepo-utils/*"
# link local packages that match version range (e.g. "^2.11.0") instead of downloading from npm
linkWorkspacePackages: true
# lerna does not need build scripts of these packages
allowBuilds:
  '@parcel/watcher': false
  nx: false
# fix vulnerabilities of transitive dependencies (undici via lerna > nx)
overrides:
  'undici@7': '^7.30.2'
